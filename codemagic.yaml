workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CodeMagic   # must match the API key name in Codemagic
    environment:
      groups:
        - sweetcasa_secrets          # holds GOOGLE_MAPS_API_KEY, GOOGLE_IOS_URL_SCHEME, CERTIFICATE_PRIVATE_KEY
      vars:
        BUNDLE_ID: "com.sweetcasa.app"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Generate native iOS project
        script: npx expo prebuild --platform ios --no-install
      - name: Install pods
        script: cd ios && pod install
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          WORKSPACE="ios/$(ls ios | grep xcworkspace | head -1)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true