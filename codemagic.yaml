workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic   # name you give the API key in Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sweetcasa.app
      vars:
        BUNDLE_ID: "com.sweetcasa.app"
        APP_STORE_APPLE_ID: 6833774701   # from App Store Connect > App Information > Apple ID
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Generate native iOS project
        script: npx expo prebuild --platform ios --no-install
      - name: Install pods
        script: cd ios && pod install
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          cd ios
          agvtool new-version -all $(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID") + 1))
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/$(ls ios | grep xcworkspace | head -1)" \
            --scheme "$(ls ios | grep xcworkspace | head -1 | sed 's/.xcworkspace//')"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true