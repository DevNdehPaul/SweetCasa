<header class="topbar-shell" data-i18n-safe><div class="topbar"><a routerLink="/" class="brand"><img src="/assets/images/icon.png" alt="SweetCasa logo"><b>SweetCasa</b></a><nav><a routerLink="/">{{i18n.t('home')}}</a><a routerLink="/auth" [queryParams]="{mode:'login'}">{{i18n.t('signIn')}}</a><button type="button" class="iconbtn" (click)="theme.toggle()">{{theme.mode()==='light'?'☾':'☀'}}</button><button type="button" class="lang" (click)="i18n.setLang(i18n.lang()==='en'?'fr':'en')">{{i18n.lang()==='en'?'FR':'EN'}}</button><a class="btn primary" routerLink="/auth" [queryParams]="{mode:'signup'}">{{i18n.t('createAccount')}}</a></nav></div></header>
